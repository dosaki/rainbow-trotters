name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node setup
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install zopfli-capable zip
        run: sudo apt-get update && sudo apt-get install -y advancecomp

      - name: Install dependencies
        run: npm ci

      - name: Cache browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Lint and tests
        run: npm test

      - name: Pack and check the budget
        run: ./build.sh --dist

      - name: Verify the game actually boots
        run: node scripts/verify.mjs dist/rainbow-trotters.zip

      - name: Pack the wavedash build
        run: ./build.sh --ci --wavedash

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          js=dist/rainbow-trotters.zip
          wd=dist/rainbow-trotters-wavedash.zip
          jsize=$(( $(wc -c < "$js") ))
          wsize=$(( $(wc -c < "$wd") ))

          last=$(git tag -l 'v[0-9]*' | sed 's/^v//' | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          tag="v$(( ${last:-0} + 1 ))"

          git tag "$tag"
          git push origin "$tag"

          {
            printf -- '- js13k: %s bytes (%s spare)\n' "$jsize" "$(( 13312 - jsize ))"
            printf -- '- wavedash: %s bytes (%s spare)\n' "$wsize" "$(( 13312 - wsize ))"
          } > notes.md

          gh release create "$tag" "$js" "$wd" --title "$tag" --notes-file notes.md
